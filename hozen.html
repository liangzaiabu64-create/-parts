<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NID保全カレンダー">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M16 14h32v8H16zM16 28h32v22H16z' fill='none' stroke='%23fb923c' stroke-width='3'/%3E%3Cpath d='M22 36l5 5 9-11' fill='none' stroke='%23fb923c' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>NID保全カレンダー</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .font-tech { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace; letter-spacing: -0.01em; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.04;
    pointer-events: none; z-index: 0;
  }
  .container { position: relative; max-width: 720px; margin: 0 auto; padding-bottom: 80px; }

  /* ───── ヘッダー ───── */
  .header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,10,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid #171717; padding: 20px 20px 14px;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
  .subtitle { font-size: 10px; color: #404040; text-transform: uppercase; letter-spacing: 0.15em; margin-top: 4px; }
  .sync-status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #525252; font-family: ui-monospace, monospace; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #525252; flex-shrink: 0; }
  .sync-dot.synced { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
  .sync-dot.loading { background: #fb923c; animation: pulse 1.5s infinite; }
  .sync-dot.error { background: #ef4444; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ───── 月セレクタ ───── */
  .month-bar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .month-nav { width: 38px; height: 38px; border-radius: 10px; background: #171717; border: 1px solid #262626; display: flex; align-items: center; justify-content: center; color: #a3a3a3; transition: all 0.15s; flex-shrink: 0; }
  .month-nav:hover { background: #262626; color: #fb923c; }
  .month-nav:active { transform: scale(0.92); }
  .month-nav:disabled { opacity: 0.3; cursor: not-allowed; }
  .month-nav svg { width: 18px; height: 18px; }
  .month-display { flex: 1; text-align: center; }
  .month-display .ym { font-size: 26px; font-weight: 900; font-family: ui-monospace, monospace; letter-spacing: -0.02em; }
  .month-display .ym .mon { color: #fb923c; }
  .month-display .label { font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-top: 2px; }

  /* ───── 進捗集計バー ───── */
  .progress-section { padding: 16px 20px 8px; }
  .progress-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .progress-card { background: #171717; border: 1px solid #262626; border-radius: 14px; padding: 14px 16px; }
  .progress-card .pc-label { font-family: ui-monospace, monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: #737373; margin-bottom: 8px; }
  .progress-card .pc-rate { display: flex; align-items: baseline; gap: 4px; }
  .progress-card .pc-rate .num { font-family: ui-monospace, monospace; font-weight: 900; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }
  .progress-card .pc-rate .pct { font-size: 14px; color: #737373; font-weight: 700; }
  .progress-card .pc-frac { font-family: ui-monospace, monospace; font-size: 11px; color: #525252; margin-top: 4px; }
  .progress-card.month .num { color: #fb923c; }
  .progress-card.cumulative .num { color: #60a5fa; }
  .progress-bar-track { height: 5px; background: #0a0a0a; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .progress-card.month .progress-bar-fill { background: #fb923c; }
  .progress-card.cumulative .progress-bar-fill { background: #60a5fa; }

  /* ───── フィルタチップ ───── */
  .filter-chips { display: flex; gap: 6px; padding: 8px 20px 4px; flex-wrap: wrap; }
  .chip { padding: 7px 13px; background: #171717; border: 1px solid #262626; border-radius: 999px; font-size: 12px; font-weight: 600; color: #a3a3a3; transition: all 0.15s; }
  .chip:hover { background: #262626; }
  .chip.active { background: rgba(251,146,60,0.12); border-color: #fb923c; color: #fb923c; }
  .chip .cnt { font-family: ui-monospace, monospace; opacity: 0.7; margin-left: 4px; }

  /* ───── 項目リスト ───── */
  .list { padding: 12px 20px 0; display: flex; flex-direction: column; gap: 8px; }
  .item-card { background: #171717; border: 1px solid #262626; border-radius: 14px; overflow: hidden; transition: border-color 0.15s; }
  .item-card.status-done { border-color: rgba(34,197,94,0.4); }
  .item-card.status-check { border-color: rgba(96,165,250,0.45); }
  .item-card.carried { border-left: 3px solid #eab308; }
  .item-main { display: flex; align-items: stretch; }
  .item-statusbar { width: 5px; flex-shrink: 0; background: #404040; }
  .item-card.status-done .item-statusbar { background: #22c55e; }
  .item-card.status-check .item-statusbar { background: #60a5fa; }
  .item-body { flex: 1; min-width: 0; padding: 12px 14px; }
  .item-head { display: flex; align-items: flex-start; gap: 8px; }
  .item-titles { flex: 1; min-width: 0; }
  .item-name { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .item-model { font-family: ui-monospace, monospace; font-size: 11px; color: rgba(251,146,60,0.9); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; font-size: 10px; color: #737373; font-family: ui-monospace, monospace; }
  .item-meta .mtag { display: inline-flex; align-items: center; gap: 3px; }
  .item-meta .mtag svg { width: 11px; height: 11px; opacity: 0.7; }
  .status-pill { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-family: ui-monospace, monospace; white-space: nowrap; }
  .status-pill.s-undone { background: #262626; color: #a3a3a3; }
  .status-pill.s-done { background: rgba(34,197,94,0.15); color: #4ade80; }
  .status-pill.s-check { background: rgba(96,165,250,0.15); color: #60a5fa; }
  .status-pill.s-pulled { background: rgba(234,179,8,0.15); color: #fbbf24; }
  /* 前倒し済カード: 淡色＋破線で「消化済み」と分かるように */
  .item-card.status-pulled { opacity: 0.6; border-style: dashed; }
  .item-card.status-pulled .item-statusbar { background: #b45309; }
  /* 前倒しボタン（モーダル内） */
  .pull-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .pull-btn { background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.35); color: #fb923c; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 9px; transition: all 0.15s; }
  .pull-btn:hover { background: rgba(251,146,60,0.2); }
  .pull-btn:active { transform: scale(0.96); }
  .carry-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(234,179,8,0.15); color: #fbbf24; font-family: ui-monospace, monospace; margin-left: 6px; }

  /* アクションボタン行 */
  .item-actions { display: flex; gap: 6px; padding: 0 14px 12px; }
  .act-btn { flex: 1; padding: 9px 8px; border-radius: 9px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 5px; transition: all 0.15s; border: 1px solid #262626; background: #0f0f0f; color: #a3a3a3; }
  .act-btn svg { width: 14px; height: 14px; }
  .act-btn:active { transform: scale(0.96); }
  .act-btn.primary { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.4); color: #4ade80; }
  .act-btn.primary:hover { background: rgba(34,197,94,0.2); }
  .act-btn.check { background: rgba(96,165,250,0.12); border-color: rgba(96,165,250,0.4); color: #60a5fa; }
  .act-btn.check:hover { background: rgba(96,165,250,0.2); }
  .act-btn.undo:hover { background: #1a1a1a; color: #fafafa; }
  .act-btn.plan { background: rgba(251,146,60,0.1); border-color: rgba(251,146,60,0.35); color: #fb923c; }

  /* ───── 空状態 ───── */
  .empty { text-align: center; padding: 70px 24px; }
  .empty-icon { width: 60px; height: 60px; border-radius: 16px; background: #171717; border: 1px solid #262626; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .empty-icon svg { width: 26px; height: 26px; color: #525252; }
  .empty h2 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .empty p { margin: 0; font-size: 13px; color: #737373; }

  /* ───── トースト ───── */
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #262626; border: 1px solid #404040; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 60; box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: slideUp 0.25s ease-out; max-width: 90vw; text-align: center; }
  .toast.error { border-color: #ef4444; }
  .toast.success { border-color: #22c55e; }
  @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

  /* ───── ローディング ───── */
  .loader { border: 3px solid #262626; border-top-color: #fb923c; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center-load { padding: 80px 24px; text-align: center; color: #737373; }
  .center-load .loader { margin: 0 auto 16px; }

  /* ───── セットアップ画面 ───── */
  .setup { padding: 40px 24px; max-width: 520px; margin: 0 auto; }
  .setup-icon { width: 60px; height: 60px; border-radius: 16px; background: rgba(251,146,60,0.1); border: 1px solid #fb923c; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .setup-icon svg { width: 26px; height: 26px; color: #fb923c; }
  .setup h2 { margin: 0 0 8px; font-size: 20px; font-weight: 900; text-align: center; }
  .setup .lead { text-align: center; color: #a3a3a3; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  .setup-field { margin-bottom: 16px; }
  .setup-field label { display: block; font-family: ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #737373; margin-bottom: 8px; }
  .setup-field input { width: 100%; background: #171717; border: 1px solid #262626; border-radius: 12px; padding: 12px 16px; color: #fafafa; font-size: 13px; outline: none; font-family: ui-monospace, monospace; transition: border-color 0.15s; }
  .setup-field input:focus { border-color: #fb923c; }
  .setup-btn { width: 100%; background: #fb923c; color: #0a0a0a; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: all 0.15s; }
  .setup-btn:hover { background: #fdba74; }
  .setup-btn:active { transform: scale(0.98); }
  .setup-help { font-size: 12px; color: #525252; line-height: 1.6; margin-top: 16px; }
  .setup-help code { background: #171717; padding: 2px 6px; border-radius: 4px; color: #fb923c; font-size: 11px; }

  /* ───── 詳細モーダル(項目編集) ───── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (min-width: 640px) { .modal-overlay { align-items: center; padding: 16px; } }
  .modal { background: #171717; border: 1px solid #262626; border-radius: 20px 20px 0 0; padding: 0; max-width: 520px; width: 100%; animation: slideUpModal 0.25s ease-out; max-height: 88vh; overflow-y: auto; }
  @media (min-width: 640px) { .modal { border-radius: 20px; } }
  @keyframes slideUpModal { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-handle { width: 36px; height: 4px; background: #404040; border-radius: 2px; margin: 12px auto 4px; }
  .modal-head { padding: 12px 20px 16px; border-bottom: 1px solid #262626; }
  .modal-head .mh-name { font-size: 18px; font-weight: 900; line-height: 1.2; }
  .modal-head .mh-model { font-family: ui-monospace, monospace; font-size: 12px; color: #fb923c; margin-top: 4px; }
  .modal-body { padding: 16px 20px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .detail-cell { background: #0f0f0f; border: 1px solid #262626; border-radius: 10px; padding: 10px 12px; }
  .detail-cell .dc-label { font-family: ui-monospace, monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #737373; margin-bottom: 4px; }
  .detail-cell .dc-value { font-size: 13px; font-weight: 600; }
  .detail-cell.full { grid-column: 1 / -1; }
  .field-block { margin-bottom: 14px; }
  .field-block label { display: block; font-family: ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #737373; margin-bottom: 7px; }
  .field-block textarea { width: 100%; background: #0f0f0f; border: 1px solid #262626; border-radius: 10px; padding: 10px 12px; color: #fafafa; font-size: 13px; outline: none; resize: none; transition: border-color 0.15s; }
  .field-block textarea:focus { border-color: #fb923c; }
  .modal-actions { display: flex; gap: 8px; padding: 0 20px 24px; }
  .modal-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; transition: all 0.15s; }
  .modal-btn.save { background: #fb923c; color: #0a0a0a; }
  .modal-btn.save:hover { background: #fdba74; }
  .modal-btn.close { background: #262626; color: #fafafa; }
  .modal-btn.close:hover { background: #404040; }

  .needs-check-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(234,179,8,0.15); color: #fbbf24; font-family: ui-monospace, monospace; margin-left: 6px; }

  .anim-up { animation: viewIn 0.25s ease-out; }
  @keyframes viewIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .hidden { display: none !important; }

  /* ───── ヘッダーボタン群（追加・印刷・再読込） ───── */
  .header-btns { display: flex; gap: 6px; flex-shrink: 0; }

  /* ───── 項目フォーム ───── */
  .if-input { width: 100%; background: #0f0f0f; border: 1px solid #262626; border-radius: 10px; padding: 10px 12px; color: #fafafa; font-size: 14px; outline: none; transition: border-color 0.15s; }
  .if-input:focus { border-color: #fb923c; }
  .if-input.mono { font-family: ui-monospace, monospace; }
  .if-input::-webkit-outer-spin-button, .if-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .if-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-block label .req { color: #fb923c; font-size: 9px; margin-left: 4px; background: rgba(251,146,60,0.12); padding: 1px 5px; border-radius: 4px; }
  .modal-sub-actions { display: flex; gap: 16px; margin-top: 8px; padding-top: 14px; border-top: 1px solid #262626; }
  .sub-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #a3a3a3; transition: color 0.15s; }
  .sub-link:hover { color: #fafafa; }
  .sub-link.danger { color: #f87171; margin-left: auto; }
  .sub-link.danger:hover { color: #fca5a5; }

  /* ───── 削除確認 ───── */
  .del-target { background: #0f0f0f; border: 1px solid #262626; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .del-name { font-weight: 700; font-size: 15px; }
  .del-model { font-size: 11px; color: #fb923c; margin-top: 3px; }
  .del-warn { font-size: 13px; color: #a3a3a3; line-height: 1.5; margin: 0 0 14px; }
  .del-norec { font-size: 12px; color: #525252; margin: 0; }
  .del-check { display: flex; gap: 10px; align-items: flex-start; background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.25); border-radius: 10px; padding: 12px; cursor: pointer; }
  .del-check input { margin-top: 2px; width: 16px; height: 16px; accent-color: #ef4444; flex-shrink: 0; }
  .del-check span { font-size: 12px; color: #fca5a5; line-height: 1.5; }
  .del-check small { color: #737373; }
  .modal-btn.danger-btn { background: #ef4444; color: #fff; }
  .modal-btn.danger-btn:hover { background: #dc2626; }

  /* ───── 印刷ビュー（画面表示） ───── */
  .print-screen { min-height: 100vh; }
  .print-toolbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: rgba(10,10,10,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #171717; }
  .pt-back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #a3a3a3; padding: 8px 12px; border-radius: 8px; transition: all 0.15s; }
  .pt-back:hover { background: #171717; color: #fafafa; }
  .pt-tabs { display: flex; gap: 6px; margin: 0 auto; }
  .pt-tab { padding: 8px 16px; background: #171717; border: 1px solid #262626; border-radius: 8px; font-size: 13px; font-weight: 600; color: #a3a3a3; transition: all 0.15s; }
  .pt-tab.active { background: rgba(251,146,60,0.12); border-color: #fb923c; color: #fb923c; }
  .pt-print { display: inline-flex; align-items: center; gap: 6px; background: #fb923c; color: #0a0a0a; font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 9px; transition: all 0.15s; }
  .pt-print:hover { background: #fdba74; }

  .print-doc { background: #fff; color: #1a1a1a; max-width: 1000px; margin: 24px auto; padding: 32px 36px; border-radius: 8px; }
  .print-head { border-bottom: 2px solid #1a1a1a; padding-bottom: 12px; margin-bottom: 16px; }
  .print-title { font-size: 22px; font-weight: 900; }
  .print-meta { display: flex; gap: 24px; margin-top: 8px; font-size: 13px; color: #444; }
  .print-meta b { color: #1a1a1a; }
  .print-summary { display: flex; gap: 16px; margin-bottom: 16px; }
  .ps-cell { flex: 1; border: 1px solid #ccc; border-radius: 6px; padding: 10px 14px; display: flex; flex-direction: column; }
  .ps-label { font-size: 11px; color: #666; }
  .ps-val { font-size: 28px; font-weight: 900; line-height: 1.1; }
  .ps-frac { font-size: 11px; color: #888; }
  .print-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  /* 列幅をcolgroupで厳守させ、長い品名/型番ははみ出さず折り返す */
  .print-table.fixed-table { table-layout: fixed; }
  .print-table.fixed-table td, .print-table.fixed-table th { word-break: break-all; white-space: normal; }
  .print-table.fixed-table td.c-model { font-size: 11px; white-space: normal; }
  .print-table th, .print-table td { border: 1px solid #bbb; padding: 6px 8px; text-align: left; }
  .print-table th { background: #f0f0f0; font-weight: 700; white-space: nowrap; }
  .print-table .c-num { width: 32px; text-align: center; color: #888; }
  .print-table .c-name { font-weight: 600; }
  .print-table .c-model { font-family: ui-monospace, monospace; color: #c2410c; white-space: nowrap; }
  .print-table .c-center { text-align: center; }
  .print-table .c-check { text-align: center; font-size: 18px; width: 48px; }
  .print-table .c-sign { width: 90px; }

<!-- Firebase SDK（部品アプリのFirestore在庫を参照するため。読み取り専用で使う） -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// 設定: Apps Script の Web アプリ URL
//   セットアップ画面で入力すると localStorage に保存される。
//   （URL自体は秘密情報ではないので保存先はlocalStorageで十分）
// ═══════════════════════════════════════════════════════════════════
const API_URL_KEY = 'nid-hozen-api-url';

// ═══════════════════════════════════════════════════════════════════
// 部品連携（機能要件7）: 部品アプリ(Firestore)の在庫を読み取り専用で参照する
//   部品アプリと「同じ」firebaseConfig を使う＝同じ parts コレクションを読む。
//   ここを部品アプリ(index.html)の firebaseConfig と一致させること。
// ═══════════════════════════════════════════════════════════════════
const partsFirebaseConfig = {
  apiKey: "AIzaSyCVuvOgFOQuC5HZneEvkklZGnJYdqsrN7g",
  authDomain: "parts-1-40d96.firebaseapp.com",
  projectId: "parts-1-40d96",
  storageBucket: "parts-1-40d96.firebasestorage.app",
  messagingSenderId: "695101125652",
  appId: "1:695101125652:web:ada09c3e92441aab73a301"
};
// 型番(正規化キー) → { qty, minQty, name, count } のマップ。起動時に1回構築。
let partsStockMap = {};
let partsLoaded = false;   // 在庫取得が完了したか
let partsError = null;     // 取得エラー（あれば文言）

// 型番の照合キー: 大文字小文字・前後空白・ハイフン・全角半角空白を無視。
//   例: 'CF10-BUU' も 'cf10buu' も '  cf10 - buu ' も同じキーになる。
//   理由: 部品アプリと保全アプリで表記が揺れても照合できるようにするため。
function stockKey(model) {
  return String(model == null ? '' : model)
    .toLowerCase()
    .replace(/[\s\u3000\-‐－―ー]/g, '');   // 空白類とハイフン各種を除去
}

// 対象年は2026固定（マスターが2026年のため）。月だけ1〜12で動かす。
// ※ state より前に定義する必要がある。state初期化時に currentYearMonth() が
//   TARGET_YEAR を参照するため、後ろに置くと「初期化前アクセス」エラーになる。
const TARGET_YEAR = 2026;

function currentYearMonth() {
  const d = new Date();
  // 現在が2026年ならその月、それ以外は2026-01を初期表示
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  if (y === TARGET_YEAR) return `${TARGET_YEAR}-${String(m).padStart(2,'0')}`;
  return `${TARGET_YEAR}-01`;
}

let state = {
  apiUrl: localStorage.getItem(API_URL_KEY) || '',
  view: 'list',            // 'setup' | 'list'
  loading: false,
  syncStatus: 'loading',   // 'loading' | 'synced' | 'error'
  master: [],              // マスター点検項目（APIから取得）
  records: [],             // 全実施記録（APIから取得）
  ym: currentYearMonth(),  // 表示中の対象年月 'YYYY-MM'
  filter: 'all',           // 'all' | 'planned' | 'undone' | 'done'
  modalItemId: null,       // 詳細モーダルで開いている項目ID
  _editNote: '',
  _editComment: '',
  itemForm: null,          // 項目の追加・編集フォーム（nullなら非表示）
  confirmDelItem: null,    // 削除確認中の項目（nullなら非表示）
  printMode: null,         // 印刷ビュー: null | 'checklist' | 'report' | 'yearly'
  monthPickerOpen: false,  // 月選択カレンダーの開閉
  yearView: false,         // 年間マトリクス画面の表示
};

// ═══════════════════════════════════════════════════════════════════
// API 通信
//   Apps Script の doGet / doPost を叩く。
//   GET: ?action=master / ?action=records
//   POST: { action, ... }  ※Apps Scriptはプリフライト回避のためtext/plainで送る
// ═══════════════════════════════════════════════════════════════════

async function apiGet(action, params = {}) {
  const url = new URL(state.apiUrl);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  // キャッシュ回避: 毎回違う値(現在時刻)を付けて、ブラウザ/中継のキャッシュではなく
  //   常にApps Scriptの最新結果を取りに行かせる。
  //   ＝seedPlans等でシートを更新した直後でも、↻で確実に反映されるようにする。
  url.searchParams.set('_t', Date.now());
  const res = await fetch(url.toString(), { method: 'GET', cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'API error');
  return data;
}

async function apiPost(payload) {
  // Apps Scriptへのpostは、CORSプリフライトを避けるため text/plain で送るのが定石。
  // （application/jsonにするとOPTIONSが飛びApps Scriptが対応しないため失敗する）
  const res = await fetch(state.apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'API error');
  return data;
}

// マスターと実施記録を両方まとめて読み込む（API呼び出し回数の節約）
async function loadAll() {
  state.loading = true;
  state.syncStatus = 'loading';
  render();
  try {
    const [m, r] = await Promise.all([
      apiGet('master'),
      apiGet('records'),
    ]);
    state.master = (m.items || []).map(normalizeMaster);
    state.records = (r.items || []).map(normalizeRecord);
    state.syncStatus = 'synced';
  } catch (e) {
    state.syncStatus = 'error';
    flash('読み込みエラー: ' + e.message, 'error');
  } finally {
    state.loading = false;
    render();
  }
  // 部品在庫の取得は本体とは独立に実行（失敗しても保全アプリは動かす）
  loadPartsStock();
}

// 部品アプリ(Firestore)の parts を読み、型番→在庫のマップを作る。
//   読み取り専用。1回だけ取得してマップ化（項目ごとの都度問い合わせを避ける）。
//   同じ型番が複数部品にある場合は、数量を合算し件数も持つ。
async function loadPartsStock() {
  // Firebase未読み込み（CDNブロック等）なら静かに諦める
  if (typeof firebase === 'undefined' || !firebase.initializeApp) {
    partsError = 'Firebase未読込';
    return;
  }
  try {
    // 既に初期化済みなら再利用（二重initを避ける。名前付きアプリで分離）
    let app;
    const existing = firebase.apps.find(a => a.name === 'partsApp');
    app = existing || firebase.initializeApp(partsFirebaseConfig, 'partsApp');
    const auth = firebase.auth(app);
    // 部品アプリのルールが「認証済みのみ読める」場合に備え匿名サインイン
    try { if (!auth.currentUser) await auth.signInAnonymously(); } catch (e) { /* 認証不要なら無視 */ }
    const db = firebase.firestore(app);
    const snap = await db.collection('parts').get();
    const map = {};
    snap.forEach(doc => {
      const d = doc.data();
      const key = stockKey(d.model);
      if (!key) return;
      const qty = Number(d.quantity) || 0;
      const minQty = Number(d.minQuantity) || 0;
      if (map[key]) {
        // 同じ型番が複数登録 → 数量合算、件数加算
        map[key].qty += qty;
        map[key].count += 1;
      } else {
        map[key] = { qty: qty, minQty: minQty, name: d.name || '', count: 1 };
      }
    });
    partsStockMap = map;
    partsLoaded = true;
    partsError = null;
    render();   // 在庫が揃ったら表示を更新
  } catch (e) {
    partsError = e.message || '取得失敗';
    partsLoaded = false;
    // 在庫が取れなくても本体は動くので、エラーは画面の在庫欄に控えめに出すだけ
    render();
  }
}

// ある点検項目に対応する在庫情報を返す。無ければ null。
function getStockForItem(item) {
  if (!item.model_no) return null;
  const key = stockKey(item.model_no);
  return partsStockMap[key] || null;
}

// Sheetsから来た値は型が緩いので、扱いやすい形に整える
function normalizeMaster(row) {
  return {
    item_id: String(row.item_id || ''),
    process: String(row.process || ''),
    part: String(row.part || ''),
    name: String(row.name || ''),
    model_no: String(row.model_no || ''),
    model_needs_check: row.model_needs_check === true || row.model_needs_check === 'TRUE' || row.model_needs_check === 'true',
    quantity: row.quantity,
    cycle_months: row.cycle_months === '' || row.cycle_months == null ? null : Number(row.cycle_months),
    prev_change_date: String(row.prev_change_date || ''),
    prev_change_raw: String(row.prev_change_raw || ''),
    note: String(row.note || ''),
    comment: String(row.comment || ''),
  };
}

// year_month を必ず 'YYYY-MM' 文字列に正規化する。
//   Sheetsが '2026-01' を日付と解釈し、ISO文字列(例 '2025-12-31T15:00:00.000Z')で
//   返してくることがある。しかも日本時間→UTC変換で月がずれる(1/1 00:00 JST = 12/31 15:00 UTC)。
//   そこで日付として読めた場合は「日本時間(UTC+9)に直してから」年月を取り出す。
function normalizeYearMonth(v) {
  if (v == null) return '';
  const s = String(v);
  // すでに 'YYYY-MM' 形式ならそのまま
  const plain = s.match(/^(\d{4})-(\d{2})$/);
  if (plain) return s;
  // ISO日付文字列なら、JST(UTC+9)に補正して年月を取り出す
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);  // UTC→JST
    const y = jst.getUTCFullYear();
    const m = String(jst.getUTCMonth() + 1).padStart(2, '0');
    return `${y}-${m}`;
  }
  // それ以外は頭6文字を試す(YYYY-MM... の形)
  const head = s.match(/^(\d{4})-(\d{2})/);
  return head ? `${head[1]}-${head[2]}` : s;
}

function normalizeRecord(row) {
  return {
    record_id: String(row.record_id || ''),
    item_id: String(row.item_id || ''),
    year_month: normalizeYearMonth(row.year_month),   // 日付化されても YYYY-MM に戻す
    planned: row.planned === true || row.planned === 'TRUE' || row.planned === 'true',
    status: String(row.status || '未'),
    done_date: String(row.done_date || ''),
    check_due_date: String(row.check_due_date || ''),
    carried_from: String(row.carried_from || ''),
    carried_to: String(row.carried_to || ''),   // 前倒し先（前倒し済レコードが当月を指す）
    updated_at: String(row.updated_at || ''),
  };
}

// ═══════════════════════════════════════════════════════════════════
// 予定(planned)の自動計算
//   前回交換日 + 周期×n が対象月と一致したら予定を立てる。
//   周期が短ければ年に複数回（倍数すべて）。前回不明は自動計算せず予定なし。
// ═══════════════════════════════════════════════════════════════════

// 'YYYY-MM-DD' or 'YYYY-MM' を {y, m} に。失敗時 null。
function parseYM(dateStr) {
  if (!dateStr) return null;
  const m = String(dateStr).match(/^(\d{4})-(\d{2})/);
  if (!m) return null;
  return { y: Number(m[1]), m: Number(m[2]) };
}

// 2つの年月の差を「月数」で返す（b - a）
function monthDiff(a, b) {
  return (b.y - a.y) * 12 + (b.m - a.m);
}

// ある項目が対象年月(ym)に予定を持つか自動判定
function isPlannedAuto(item, ym) {
  const cycle = item.cycle_months;
  if (!cycle || cycle <= 0) return false;       // 周期なし → 自動判定不可
  const prev = parseYM(item.prev_change_date);
  if (!prev) return false;                       // 前回不明 → 自動判定しない（人が設定）
  const target = parseYM(ym);
  if (!target) return false;
  const diff = monthDiff(prev, target);          // 前回からの経過月数
  if (diff <= 0) return false;                   // 前回交換日と同月以前は予定なし
  // 経過月数が周期の倍数ならその月に予定（倍数すべて）
  return diff % cycle === 0;
}

// ═══════════════════════════════════════════════════════════════════
// 状態判定ヘルパー（前倒し済の導入に伴い、status判定を1箇所に集約）
//   countsAsPlanned: 「予定として数える」= planned かつ 前倒し済でない。
//     前倒し済は将来月で消化済みなので、実施率の分母に入れない。
//   countsAsDone: 「実施済として数える」= 実施済 または 整備後確認。
// ═══════════════════════════════════════════════════════════════════
function countsAsPlanned(rec) { return rec.planned && rec.status !== '前倒し済'; }
function countsAsDone(rec) { return rec.status === '実施済' || rec.status === '整備後確認'; }

// ═══════════════════════════════════════════════════════════════════
// 対象月の「やるべき項目」とその実施記録を組み立てる
//   方針: 毎月、該当する全項目ぶんの実施記録をあらかじめ生成する。
//   ここではDB生成の前段として、画面表示用に master×records を結合する。
//   - その月に予定(自動 or 記録済み)がある項目を「対象」として並べる
//   - 既存の実施記録があればそれを使う。なければ仮レコードを組む（未保存）
// ═══════════════════════════════════════════════════════════════════
function buildMonthView(ym) {
  const recByKey = {};   // item_id+ym → record
  state.records.forEach(r => {
    if (r.year_month === ym) recByKey[r.item_id] = r;
  });

  const rows = [];
  state.master.forEach(item => {
    const existing = recByKey[item.item_id];
    const autoPlanned = isPlannedAuto(item, ym);
    // 表示対象: 既存記録がある or 自動予定が立つ項目
    if (!existing && !autoPlanned) return;
    // 予定の決定: 既存記録があればその planned を尊重(Excelの〇を取り込み済み)。
    //   記録が無い項目だけ、周期からの自動計算で補完する。
    const rec = existing || makeVirtualRecord(item, ym, autoPlanned);
    rows.push({ item, rec, virtual: !existing });
  });

  // 並び順: 未実施→実施済→整備後確認→前倒し済 の順、その中はitem_id順
  const order = { '未': 0, '実施済': 1, '整備後確認': 2, '前倒し済': 3 };
  rows.sort((a, b) => {
    const oa = order[a.rec.status] ?? 0;
    const ob = order[b.rec.status] ?? 0;
    if (oa !== ob) return oa - ob;
    return a.item.item_id.localeCompare(b.item.item_id);
  });
  return rows;
}

// 未保存の仮レコードを組む（画面表示用。保存時にDBへ書く）
function makeVirtualRecord(item, ym, planned) {
  return {
    record_id: `${item.item_id}__${ym}`,   // キー: item_id + 年月
    item_id: item.item_id,
    year_month: ym,
    planned: planned,
    status: '未',
    done_date: '',
    check_due_date: '',
    carried_from: '',
    carried_to: '',
    updated_at: '',
  };
}

// ═══════════════════════════════════════════════════════════════════
// 実施ステータス操作（DB書き込み）
// ═══════════════════════════════════════════════════════════════════

// 実施日の1週間後を 'YYYY-MM-DD' で返す
function addDays(dateStr, days) {
  const d = dateStr ? new Date(dateStr) : new Date();
  d.setDate(d.getDate() + days);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function todayStr() { return addDays('', 0); }

// レコードをupsert（あれば更新・なければ追加）してローカルにも反映
async function upsertRecord(rec) {
  // ローカル先行更新（楽観的UI）
  const idx = state.records.findIndex(r => r.record_id === rec.record_id);
  if (idx >= 0) state.records[idx] = { ...rec };
  else state.records.push({ ...rec });
  render();
  try {
    await apiPost({ action: 'upsertRecord', record: rec });
    state.syncStatus = 'synced';
  } catch (e) {
    state.syncStatus = 'error';
    flash('保存エラー: ' + e.message, 'error');
  }
  render();
}

// 「実施済み」にする
async function markDone(item, rec) {
  const today = todayStr();
  const updated = {
    ...rec,
    planned: true,                       // 実施＝その月に予定があったとみなす
    status: '実施済',
    done_date: today,
    check_due_date: addDays(today, 7),   // 1週間後を確認予定日に
  };
  await upsertRecord(updated);
  flash('実施済みにしました', 'success');
}

// 「整備後確認」完了にする（二重ステータスの2段目）
async function markChecked(item, rec) {
  const updated = { ...rec, status: '整備後確認' };
  await upsertRecord(updated);
  flash('整備後確認を完了しました', 'success');
}

// 未実施に戻す
async function markUndone(item, rec) {
  const updated = { ...rec, status: '未', done_date: '', check_due_date: '', carried_from: '' };

  // この実施が前倒しによるものなら、対になる将来月の「前倒し済」も未に戻す。
  //   ① carried_from が指す将来月を戻す（正規ルート・最優先）
  //   ② 古いデータ救済: carried_to が当月レコードを指す前倒し済も戻す（双方向で辿る）
  const targets = new Set();
  if (rec.carried_from) targets.add(rec.carried_from);
  state.records.forEach(r => {
    if (r.item_id === item.item_id && r.status === '前倒し済' && r.carried_to === rec.record_id) {
      targets.add(r.record_id);
    }
  });
  for (const tid of targets) {
    const future = state.records.find(r => r.record_id === tid);
    if (future && future.status === '前倒し済') {
      await upsertRecord({ ...future, status: '未', done_date: '', carried_to: '' });
    }
  }

  await upsertRecord(updated);
  flash('未実施に戻しました');
}

// 前倒しを取り消す（前倒し済の将来月レコードを起点に）。
//   将来月を元の「未（予定）」に戻し、対になる当月の実施済も「未」に戻す。
async function cancelPullForward(item, pulledRec) {
  // 1) 対になる当月レコードを特定（carried_to が指す当月）。
  //    実施済なら未に戻す。ステータスに関わらず carried_from（前倒しタグの元）は必ず消す。
  //    ※先に当月を「戻す」で未にしてから将来月を取り消す順序でも、タグが残らないようにする。
  const curId = pulledRec.carried_to;
  if (curId) {
    const cur = state.records.find(r => r.record_id === curId);
    if (cur) {
      const restored = { ...cur, carried_from: '' };
      if (cur.status === '実施済' || cur.status === '整備後確認') {
        restored.status = '未';
        restored.done_date = '';
        restored.check_due_date = '';
      }
      await upsertRecord(restored);
    }
  }
  // 2) 前倒し済の将来月を元の予定（未）に戻す
  await upsertRecord({ ...pulledRec, status: '未', done_date: '', carried_to: '' });
  flash('前倒しを取り消しました');
}

// record_id（item_id__YYYY-MM 形式）から月番号(1〜12)を取り出す。失敗時はnull。
function monthFromRecordId(recordId) {
  const m = String(recordId || '').match(/__\d{4}-(\d{2})$/);
  return m ? Number(m[1]) : null;
}

// 手動で予定を立てる（前回不明など自動計算されない項目用）
async function togglePlan(item, rec) {
  const updated = { ...rec, planned: !rec.planned };
  await upsertRecord(updated);
}

// ═══════════════════════════════════════════════════════════════════
// 前倒し実施（完成版設計）
//   将来月の予定を当月へ前倒して実施する。
//   方針: 当月に実施済みレコードを作り、前倒し元の将来月は「前倒し済」マークで残す
//   （削除しない＝周期からの自動予定が将来月で復活するのを防ぐ）。
// ═══════════════════════════════════════════════════════════════════

// 当月より後で、対象項目が予定を持つ月の一覧を返す。
//   既に未実施以外（実施済・前倒し済など）の将来月は候補から除外（再操作・二重前倒し防止）。
function findFuturePlans(item, fromYm) {
  const fm = Number(fromYm.split('-')[1]);
  const result = [];
  for (let m = fm + 1; m <= 12; m++) {
    const ym = `${TARGET_YEAR}-${String(m).padStart(2,'0')}`;
    const existing = state.records.find(r => r.item_id === item.item_id && r.year_month === ym);
    if (existing && existing.status !== '未') continue;   // 消化済み等は候補外
    const planned = existing ? existing.planned : isPlannedAuto(item, ym);
    if (planned) result.push({ ym, rec: existing || makeVirtualRecord(item, ym, true) });
  }
  return result;
}

// 将来月(futureYm)の予定を当月(state.ym)へ前倒して実施する。
async function runPullForward(item, futureYm) {
  const today = todayStr();
  const curYm = state.ym;
  const curRecordId = `${item.item_id}__${curYm}`;
  const futureRecordId = `${item.item_id}__${futureYm}`;

  // 当月ガード: 既に実施済み/整備後確認なら多重実施を防ぐ
  const curRec = state.records.find(r => r.item_id === item.item_id && r.year_month === curYm);
  if (curRec && (curRec.status === '実施済' || curRec.status === '整備後確認')) {
    flash('この項目は今月すでに実施済みです', 'error');
    return;
  }

  // 1) 当月を実施済みに（既存があれば更新、なければ新規）
  const curUpdated = {
    ...(curRec || makeVirtualRecord(item, curYm, true)),
    record_id: curRecordId, item_id: item.item_id, year_month: curYm,
    planned: true, status: '実施済',
    done_date: today, check_due_date: addDays(today, 7),
    carried_from: futureRecordId,   // どの将来月を前倒したか
  };
  await upsertRecord(curUpdated);

  // 2) 将来月を「前倒し済」マークで保存（削除しない＝計算予定の復活も封じる）
  const futureMarked = {
    ...makeVirtualRecord(item, futureYm, true),
    record_id: futureRecordId, item_id: item.item_id, year_month: futureYm,
    planned: true, status: '前倒し済',
    done_date: today, check_due_date: '',
    carried_to: curRecordId,         // 前倒し先（当月）を指す
  };
  await upsertRecord(futureMarked);

  flash(`${Number(futureYm.split('-')[1])}月の予定を前倒し実施しました`, 'success');
  render();
}

// ═══════════════════════════════════════════════════════════════════
// 進捗集計
//   単月: 対象月の「予定あり」を分母、「実施済 or 整備後確認」を分子
//   累計: 全月の同条件で集計（年月で絞らない）
// ═══════════════════════════════════════════════════════════════════
function calcProgress(ym) {
  // 単月: その月のビュー行から算出。前倒し済は分母に数えない（countsAsPlanned）。
  const monthRows = buildMonthView(ym);
  const monthPlanned = monthRows.filter(r => countsAsPlanned(r.rec));
  const monthDone = monthPlanned.filter(r => countsAsDone(r.rec));

  // 累計: 1〜12月を走査。前倒し済は分母にも分子にも入れない（二重計上回避）。
  //   前倒し先（当月）の実施済は countsAsDone で分子に入る。
  let cumPlanned = 0, cumDone = 0;
  for (let mm = 1; mm <= 12; mm++) {
    const y = `${TARGET_YEAR}-${String(mm).padStart(2,'0')}`;
    const rows = buildMonthView(y);
    rows.forEach(r => {
      if (countsAsPlanned(r.rec)) {
        cumPlanned++;
        if (countsAsDone(r.rec)) cumDone++;
      }
    });
  }

  return {
    month: { done: monthDone.length, planned: monthPlanned.length },
    cumulative: { done: cumDone, planned: cumPlanned },
  };
}

// ═══════════════════════════════════════════════════════════════════
// レンダリング
// ═══════════════════════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (!state.apiUrl) { app.innerHTML = renderSetup(); bindSetup(); return; }
  if (state.loading && state.master.length === 0) {
    app.innerHTML = `<div class="center-load"><div class="loader"></div>読み込み中…</div>`;
    return;
  }
  // 印刷ビュー（独立画面）
  if (state.printMode) {
    app.innerHTML = renderPrint();
    bindPrint();
    return;
  }
  app.innerHTML = renderList();
  bindList();
  // モーダル類（後勝ちで1つだけ出す）
  document.querySelector('.modal-overlay')?.remove();
  if (state.itemForm) {
    document.body.insertAdjacentHTML('beforeend', renderItemForm());
    bindItemForm();
  } else if (state.confirmDelItem) {
    document.body.insertAdjacentHTML('beforeend', renderDeleteConfirm());
    bindDeleteConfirm();
  } else if (state.modalItemId) {
    document.body.insertAdjacentHTML('beforeend', renderModal());
    bindModal();
  }
}

      return;
    }
    state.apiUrl = url;
    localStorage.setItem(API_URL_KEY, url);
    loadAll();
  });
}

// 月選択カレンダー（1〜12月をグリッドで選ぶ）。各月の予定件数も小さく出す。
function renderMonthPicker(year, currentMonth) {
  const cells = [];
  for (let m = 1; m <= 12; m++) {
    const ym = `${TARGET_YEAR}-${String(m).padStart(2,'0')}`;
    const rows = buildMonthView(ym);
    const planned = rows.filter(r => r.rec.planned).length;
    const done = rows.filter(r => r.rec.planned && (r.rec.status === '実施済' || r.rec.status === '整備後確認')).length;
    const isCurrent = m === currentMonth;
    cells.push(`
      <button class="mp-cell ${isCurrent ? 'active' : ''}" data-month="${m}">
        <div class="mp-month">${m}<span class="mp-gatsu">月</span></div>
        ${planned > 0 ? `<div class="mp-count">${done}/${planned}</div>` : `<div class="mp-count empty">—</div>`}
      </button>
    `);
  }
  return `
    <div class="month-picker-overlay" id="mp-overlay">
      <div class="month-picker">
        <div class="mp-head">
          <span class="mp-year">${year}年</span>
          <button class="mp-close" id="mp-close"><svg width="18" height="18"><use href="#i-x"/></svg></button>
        </div>
        <div class="mp-grid">${cells.join('')}</div>
        <div class="mp-hint">数字は 実施済 / 予定 の件数</div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════
// 印刷ビュー（機能要件6）
//   2種類を切替: チェックリスト（当月の予定一覧）と 進捗レポート（実施率込み）。
//   画面の操作部は print.css で印刷時に隠し、紙に出るのは表だけにする。
// ═══════════════════════════════════════════════════════════════════
// 年間マトリクス（項目×12ヶ月）のデータを組む。
//   各項目について、12ヶ月それぞれの予定有無と実施状況を集める。
//   予定がある月だけ残す（年間通して1度も予定がない項目は表に出さない）。
function buildYearlyMatrix() {
  // 月ごとのビューを先に全部作り、item_id→月→record を引けるようにする
  const byItemMonth = {};   // item_id → { 1..12 → rec }
  for (let m = 1; m <= 12; m++) {
    const ym = `${TARGET_YEAR}-${String(m).padStart(2,'0')}`;
    buildMonthView(ym).forEach(r => {
      if (!r.rec.planned) return;   // 予定がある月だけ拾う
      if (!byItemMonth[r.item.item_id]) byItemMonth[r.item.item_id] = { item: r.item, months: {} };
      byItemMonth[r.item.item_id].months[m] = r.rec;
    });
  }
  // 配列化して item_id 順に並べる
  const list = Object.values(byItemMonth);
  list.sort((a, b) => a.item.item_id.localeCompare(b.item.item_id));
  return list;
}

// 年間マトリクスの表HTML（画面・印刷で共用）
function renderYearlyTable() {
  const matrix = buildYearlyMatrix();
  const monthHeaders = [];
  for (let m = 1; m <= 12; m++) monthHeaders.push(`<th class="ym-mcol">${m}</th>`);

  const bodyRows = matrix.map((row, i) => {
    const { item, months } = row;
    const cells = [];
    for (let m = 1; m <= 12; m++) {
      const rec = months[m];
      if (!rec) { cells.push(`<td class="ym-cell"></td>`); continue; }
      // 実施済・整備後確認は●、前倒し済は→、予定のみは〇
      let mark, cls;
      if (rec.status === '実施済' || rec.status === '整備後確認') { mark = '●'; cls = 'done'; }
      else if (rec.status === '前倒し済') { mark = '→'; cls = 'pulled'; }
      else { mark = '〇'; cls = 'plan'; }
      cells.push(`<td class="ym-cell ${cls}">${mark}</td>`);
    }
    return `<tr>
      <td class="c-num">${i + 1}</td>
      <td class="ym-proc">${esc(item.process)}</td>
      <td class="ym-part">${esc(item.part)}</td>
      <td class="c-name">${esc(item.name)}</td>
      <td class="c-model">${esc(item.model_no)}</td>
      ${cells.join('')}
    </tr>`;
  }).join('');

  return `
    <table class="print-table yearly-table">
      <colgroup>
        <col style="width:28px"><col style="width:8%"><col style="width:8%"><col style="width:20%"><col style="width:14%">
        ${Array.from({length:12}, () => '<col style="width:3.3%">').join('')}
      </colgroup>
      <thead>
        <tr>
          <th>No</th><th>工程</th><th>部位</th><th>品名</th><th>型番</th>
          ${monthHeaders.join('')}
        </tr>
      </thead>
      <tbody>${bodyRows || `<tr><td colspan="17" class="c-center">予定のある項目がありません</td></tr>`}</tbody>
    </table>
    <div class="ym-legend"><span class="lg-plan">〇</span> 予定　<span class="lg-done">●</span> 実施済　<span class="lg-pulled">→</span> 前倒し済</div>
  `;
}

function renderPrint() {
  const ym = state.ym;
  const [yy, mm] = ym.split('-');
  const rows = buildMonthView(ym);
  // 予定がある項目だけを対象に（チェックリスト・レポートとも当月予定が母数）
  const planned = rows.filter(r => r.rec.planned);
  const prog = calcProgress(ym);
  const monthPct = prog.month.planned > 0 ? Math.round(prog.month.done / prog.month.planned * 100) : 0;
  const cumPct = prog.cumulative.planned > 0 ? Math.round(prog.cumulative.done / prog.cumulative.planned * 100) : 0;
  const today = todayStr();

  const isReport = state.printMode === 'report';
  const isYearly = state.printMode === 'yearly';

  // 年間モードは専用レイアウト
  if (isYearly) {
    return `
      <div class="print-screen">
        <div class="print-toolbar no-print">
          <button class="pt-back" id="print-back"><svg width="16" height="16"><use href="#i-chev-l"/></svg>戻る</button>
          <div class="pt-tabs">
            <button class="pt-tab" data-mode="checklist">チェックリスト</button>
            <button class="pt-tab" data-mode="report">進捗レポート</button>
            <button class="pt-tab active" data-mode="yearly">年間計画</button>
          </div>
          <button class="pt-print" id="do-print"><svg width="16" height="16"><use href="#i-printer"/></svg>印刷する</button>
        </div>
        <div class="print-doc landscape">
          <div class="print-head">
            <div class="print-title">NID保全カレンダー ${yy}年 年間計画表</div>
            <div class="print-meta">
              <span>出力日: ${today}</span>
            </div>
          </div>
          ${renderYearlyTable()}
          <div class="print-foot">※ 〇=予定 / ●=実施済。月セルの記号は各月の予定・実施状況を表します。</div>
        </div>
      </div>
    `;
  }

  // 表の行を組む
  const bodyRows = planned.map((r, i) => {
    const { item, rec } = r;
    const statusText = rec.status === '整備後確認' ? '整備後確認済' : rec.status === '実施済' ? '実施済' : rec.status === '前倒し済' ? '前倒し済' : '未実施';
    if (isReport) {
      // 進捗レポート: 実施状況・実施日・確認予定日を含む
      return `<tr>
        <td class="c-num">${i + 1}</td>
        <td>${esc(item.process)}</td>
        <td>${esc(item.part)}</td>
        <td class="c-name">${esc(item.name)}</td>
        <td class="c-model">${esc(item.model_no)}</td>
        <td class="c-center">${item.cycle_months || ''}</td>
        <td class="c-center c-status ${rec.status !== '未' ? 'done' : ''}">${statusText}</td>
        <td class="c-center">${esc(rec.done_date)}</td>
        <td class="c-center">${esc(rec.check_due_date)}</td>
      </tr>`;
    }
    // チェックリスト: 手書きチェック欄を設ける
    return `<tr>
      <td class="c-num">${i + 1}</td>
      <td>${esc(item.process)}</td>
      <td>${esc(item.part)}</td>
      <td class="c-name">${esc(item.name)}</td>
      <td class="c-model">${esc(item.model_no)}</td>
      <td class="c-center">${item.cycle_months || ''}</td>
      <td class="c-center">${esc(String(item.quantity ?? ''))}</td>
      <td class="c-check">☐</td>
      <td class="c-sign"></td>
    </tr>`;
  }).join('');

  const headRow = isReport ? `
    <tr><th>No</th><th>工程</th><th>部位</th><th>品名</th><th>型番</th><th>周期</th><th>状況</th><th>実施日</th><th>確認予定日</th></tr>
  ` : `
    <tr><th>No</th><th>工程</th><th>部位</th><th>品名</th><th>型番</th><th>周期</th><th>数量</th><th>実施</th><th>確認者</th></tr>
  `;

  return `
    <div class="print-screen">
      <div class="print-toolbar no-print">
        <button class="pt-back" id="print-back"><svg width="16" height="16"><use href="#i-chev-l"/></svg>戻る</button>
        <div class="pt-tabs">
          <button class="pt-tab ${!isReport ? 'active' : ''}" data-mode="checklist">チェックリスト</button>
          <button class="pt-tab ${isReport ? 'active' : ''}" data-mode="report">進捗レポート</button>
          <button class="pt-tab" data-mode="yearly">年間計画</button>
        </div>
        <button class="pt-print" id="do-print"><svg width="16" height="16"><use href="#i-printer"/></svg>印刷する</button>
      </div>

      <div class="print-doc">
        <div class="print-head">
          <div class="print-title">NID保全カレンダー ${isReport ? '進捗レポート' : 'チェックリスト'}</div>
          <div class="print-meta">
            <span>対象年月: <b>${yy}年${Number(mm)}月</b></span>
            <span>出力日: ${today}</span>
            <span>対象項目: ${planned.length}件</span>
          </div>
        </div>
        ${isReport ? `
          <div class="print-summary">
            <div class="ps-cell"><span class="ps-label">単月実施率</span><span class="ps-val">${monthPct}%</span><span class="ps-frac">${prog.month.done}/${prog.month.planned}件</span></div>
            <div class="ps-cell"><span class="ps-label">累計実施率（年間）</span><span class="ps-val">${cumPct}%</span><span class="ps-frac">${prog.cumulative.done}/${prog.cumulative.planned}件</span></div>
          </div>
        ` : ''}
        <table class="print-table fixed-table">
          <colgroup>
            <col style="width:32px"><col style="width:10%"><col style="width:10%"><col style="width:24%"><col style="width:20%">
            <col style="width:7%"><col style="width:9%"><col style="width:10%"><col style="width:auto">
          </colgroup>
          <thead>${headRow}</thead>
          <tbody>${bodyRows || `<tr><td colspan="9" class="c-center">この月の予定項目はありません</td></tr>`}</tbody>
        </table>
        <div class="print-foot">
          ${isReport ? '※ 状況は出力時点のものです。' : '※ 実施したら「実施」欄にチェックし、確認者欄に署名してください。'}
        </div>
      </div>
    </div>
  `;
}

function bindPrint() {
  document.getElementById('print-back').addEventListener('click', () => {
    state.printMode = null;
    render();
  });
  document.querySelectorAll('.pt-tab').forEach(t => {
    t.addEventListener('click', () => {
      state.printMode = t.dataset.mode;
      render();
    });
  });
  document.getElementById('do-print').addEventListener('click', () => {
    window.print();   // ブラウザの印刷ダイアログを開く（PDF保存も可能）
  });
}


// 在庫タグのHTMLを返す（カード用）。型番なし・在庫未取得時は空文字。
//   状態: 在庫あり(緑) / 在庫不足(赤・部品側のminQuantity割れ) / 在庫0(赤) / 部品未登録(灰)
function renderStockTag(item) {
  if (!item.model_no) return '';            // 型番が無い項目は在庫照合できない
  if (!partsLoaded) {
    return partsError ? '' : '<span class="stock-tag loading">在庫確認中…</span>';
  }
  const stock = getStockForItem(item);
  if (!stock) {
    return '<span class="stock-tag none"><svg width="10" height="10"><use href="#i-box"/></svg>部品未登録</span>';
  }
  const low = stock.minQty > 0 && stock.qty < stock.minQty;
  const zero = stock.qty <= 0;
  const cls = (zero || low) ? 'short' : 'ok';
  const warn = zero ? '在庫切れ' : (low ? '在庫不足' : '');
  return `<span class="stock-tag ${cls}"><svg width="10" height="10"><use href="#i-box"/></svg>在庫 ${stock.qty}${warn ? ' ' + warn : ''}</span>`;
}

// 詳細モーダル用の在庫セル。型番なしの項目では空（セルを出さない）。
function renderStockDetailCell(item) {
  if (!item.model_no) return '';
  let inner;
  if (!partsLoaded) {
    inner = partsError
      ? `<span style="color:#737373;">取得できませんでした</span>`
      : `在庫確認中…`;
  } else {
    const stock = getStockForItem(item);
    if (!stock) {
      inner = `<span style="color:#737373;">部品アプリに未登録</span>`;
    } else {
      const low = stock.minQty > 0 && stock.qty < stock.minQty;
      const zero = stock.qty <= 0;
      const color = (zero || low) ? '#f87171' : '#4ade80';
      const warn = zero ? ' （在庫切れ）' : (low ? ` （最低${stock.minQty}を下回る）` : '');
      const multi = stock.count > 1 ? ` <small style="color:#737373;">※${stock.count}件合算</small>` : '';
      inner = `<span style="color:${color};font-weight:700;">${stock.qty}</span>${warn}${multi}`;
    }
  }
  return `<div class="detail-cell full"><div class="dc-label">部品在庫（型番照合）</div><div class="dc-value">${inner}</div></div>`;
}

function renderItemCard(row) {
  const { item, rec } = row;
  const status = rec.status;
  const statusClass = status === '実施済' ? 'status-done' : status === '整備後確認' ? 'status-check' : status === '前倒し済' ? 'status-pulled' : '';
  // 前倒しの方向を月つきで表示する。
  //   当月側(carried_from=将来月を前倒した): 「N月分を前倒し」
  //   将来月側(carried_to=当月に前倒した):   「N月で実施済」
  let carried = '';
  if (rec.carried_from) {
    const fm = monthFromRecordId(rec.carried_from);
    carried = `<span class="carry-tag"><svg width="9" height="9"><use href="#i-repeat"/></svg>${fm ? fm + '月分を前倒し' : '前倒し実施'}</span>`;
  } else if (rec.carried_to) {
    const tm = monthFromRecordId(rec.carried_to);
    carried = `<span class="carry-tag"><svg width="9" height="9"><use href="#i-repeat"/></svg>${tm ? tm + '月で実施済' : '前倒し済'}</span>`;
  }

  const statusPill =
    status === '実施済' ? `<span class="status-pill s-done">実施済</span>` :
    status === '整備後確認' ? `<span class="status-pill s-check">確認済</span>` :
    status === '前倒し済' ? `<span class="status-pill s-pulled">前倒し済</span>` :
    `<span class="status-pill s-undone">未</span>`;

  // メタ情報（工程・部位はカード上部に移したので、ここでは周期・実施日など）
  const metas = [];
  if (item.cycle_months) metas.push(`<span class="mtag"><svg><use href="#i-repeat"/></svg>${item.cycle_months}ヶ月</span>`);
  if (rec.done_date) metas.push(`<span class="mtag"><svg><use href="#i-check"/></svg>${esc(rec.done_date)}</span>`);
  if (status === '実施済' && rec.check_due_date) metas.push(`<span class="mtag"><svg><use href="#i-clock"/></svg>確認予定 ${esc(rec.check_due_date)}</span>`);

  // 部品在庫タグ（型番が部品アプリと照合できた場合のみ）
  const stockTag = renderStockTag(item);

  // 工程・部位を上部のパンくず風に（工程 › 部位）
  const breadcrumb = [];
  if (item.process) breadcrumb.push(esc(item.process));
  if (item.part) breadcrumb.push(esc(item.part));
  const breadcrumbHtml = breadcrumb.length
    ? `<div class="item-breadcrumb">${breadcrumb.join('<span class="bc-sep">›</span>')}</div>`
    : '';

  // アクションボタン（ステータスにより出し分け）
  let actions = '';
  if (status === '未') {
    if (rec.planned) {
      actions = `
        <button class="act-btn primary" data-act="done" data-id="${item.item_id}"><svg><use href="#i-check"/></svg>実施済みにする</button>
      `;
    } else {
      // 予定がない項目: 手動で予定を立てるボタン
      actions = `
        <button class="act-btn plan" data-act="plan" data-id="${item.item_id}"><svg><use href="#i-plus"/></svg>今月の予定にする</button>
        <button class="act-btn primary" data-act="done" data-id="${item.item_id}"><svg><use href="#i-check"/></svg>実施済み</button>
      `;
    }
  } else if (status === '実施済') {
    actions = `
      <button class="act-btn check" data-act="check" data-id="${item.item_id}"><svg><use href="#i-check"/></svg>整備後確認 完了</button>
      <button class="act-btn undo" data-act="undo" data-id="${item.item_id}"><svg><use href="#i-undo"/></svg>戻す</button>
    `;
  } else if (status === '整備後確認') {
    actions = `
      <button class="act-btn undo" data-act="undo" data-id="${item.item_id}"><svg><use href="#i-undo"/></svg>未実施に戻す</button>
    `;
  } else if (status === '前倒し済') {
    // 前倒し済の月から直接、前倒しを取り消せる導線（対になる当月の実施済も連動して戻す）
    actions = `
      <button class="act-btn undo" data-act="cancel-pull" data-id="${item.item_id}"><svg><use href="#i-undo"/></svg>前倒しを取り消す</button>
    `;
  }

  return `
    <div class="item-card ${statusClass} ${(rec.carried_from || rec.carried_to) ? 'carried' : ''}">
      <div class="item-main">
        <div class="item-statusbar"></div>
        <div class="item-body" data-act="open" data-id="${item.item_id}">
          <div class="item-head">
            <div class="item-titles">
              ${breadcrumbHtml}
              <div class="item-name">${esc(item.name) || '(無題)'}${carried}</div>
              <div class="item-model">${item.model_no ? esc(item.model_no) : '—'}${item.model_needs_check ? `<span class="needs-check-badge"><svg width="9" height="9"><use href="#i-alert"/></svg>要確認</span>` : ''}${stockTag}</div>
            </div>
            ${statusPill}
          </div>
          <div class="item-meta">${metas.join('')}</div>
        </div>
      </div>
      ${actions ? `<div class="item-actions">${actions}</div>` : ''}
    </div>
  `;
}

          ${pullForwardHtml}
          <div class="modal-sub-actions">
            <button class="sub-link" id="modal-edit-item"><svg width="13" height="13"><use href="#i-edit"/></svg>項目を編集</button>
            <button class="sub-link danger" id="modal-delete-item"><svg width="13" height="13"><use href="#i-trash"/></svg>項目を削除</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn close" id="modal-close">閉じる</button>
          <button class="modal-btn save" id="modal-save">保存</button>
        </div>
      </div>
    </div>
  `;
}

function bindModal() {
  const close = () => { state.modalItemId = null; render(); };
  document.getElementById('modal-close').addEventListener('click', close);
  document.querySelector('.modal-overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) close();
  });
  // 前倒し実行ボタン
  document.querySelectorAll('.pull-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = state.master.find(x => x.item_id === state.modalItemId);
      if (!item) return;
      await runPullForward(item, btn.dataset.pullYm);
      state.modalItemId = null;   // 実行後モーダルを閉じる（多重実行の防止にも）
      render();
    });
  });
  // 項目を編集 → 編集フォームを開く（詳細モーダルは閉じる）
  document.getElementById('modal-edit-item').addEventListener('click', () => {
    const item = state.master.find(x => x.item_id === state.modalItemId);
    if (!item) return;
    state.itemForm = { mode: 'edit', ...item };
    state.modalItemId = null;
    render();
  });
  // 項目を削除 → 削除確認へ
  document.getElementById('modal-delete-item').addEventListener('click', () => {
    const item = state.master.find(x => x.item_id === state.modalItemId);
    if (!item) return;
    state.confirmDelItem = item;
    state.modalItemId = null;
    render();
  });
  document.getElementById('modal-save').addEventListener('click', async () => {
    const item = state.master.find(x => x.item_id === state.modalItemId);
    if (!item) return;
    const note = document.getElementById('edit-note').value;
    const comment = document.getElementById('edit-comment').value;
    // ローカル反映
    item.note = note; item.comment = comment;
    try {
      // note と comment をそれぞれマスターに保存（item_idで対象特定）
      await apiPost({ action: 'updateMasterField', item_id: item.item_id, field: 'note', value: note });
      await apiPost({ action: 'updateMasterField', item_id: item.item_id, field: 'comment', value: comment });
      flash('保存しました', 'success');
    } catch (e) {
      flash('保存エラー: ' + e.message, 'error');
    }
    state.modalItemId = null;
    render();
  });
}

// ═══════════════════════════════════════════════════════════════════
// 項目の追加・編集フォーム（機能要件5）
// ═══════════════════════════════════════════════════════════════════

// 新規項目のID発番: 取り込み連番(2026-001)と区別できる手動追加ID。
//   '2026-M' + ランダム5文字。複数人が同時追加してもまず衝突しない。
function genManualItemId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';  // 紛らわしい0/O/1/Iを除外
  let r = '';
  for (let i = 0; i < 5; i++) r += chars[Math.floor(Math.random() * chars.length)];
  return `${TARGET_YEAR}-M${r}`;
}

function renderItemForm() {
  const f = state.itemForm;
  const isEdit = f.mode === 'edit';
  return `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-head">
          <div class="mh-name">${isEdit ? '項目を編集' : '点検項目を追加'}</div>
          ${isEdit ? `<div class="mh-model font-tech">${esc(f.item_id)}</div>` : `<div class="mh-model font-tech">ID自動発番</div>`}
        </div>
        <div class="modal-body">
          <div class="field-block">
            <label>品名 <span class="req">必須</span></label>
            <input class="if-input" id="if-name" type="text" value="${esc(f.name || '')}" placeholder="例: カムフォロア CF10-BUU">
          </div>
          <div class="field-block">
            <label>型番（部品連携の照合キー）</label>
            <input class="if-input mono" id="if-model" type="text" value="${esc(f.model_no || '')}" placeholder="例: CF10-BUU">
          </div>
          <div class="if-row">
            <div class="field-block">
              <label>工程</label>
              <input class="if-input" id="if-process" type="text" value="${esc(f.process || '')}" placeholder="例: フィーダー">
            </div>
            <div class="field-block">
              <label>部位</label>
              <input class="if-input" id="if-part" type="text" value="${esc(f.part || '')}" placeholder="例: クランプ">
            </div>
          </div>
          <div class="if-row">
            <div class="field-block">
              <label>交換周期（月）</label>
              <input class="if-input" id="if-cycle" type="number" inputmode="numeric" min="0" value="${f.cycle_months ?? ''}" placeholder="例: 6">
            </div>
            <div class="field-block">
              <label>設置数量</label>
              <input class="if-input" id="if-qty" type="text" value="${esc(String(f.quantity ?? ''))}" placeholder="例: 16">
            </div>
          </div>
          <div class="field-block">
            <label>前回交換日（YYYY-MM-DD・任意）</label>
            <input class="if-input mono" id="if-prev" type="text" value="${esc(f.prev_change_date || '')}" placeholder="例: 2025-10-01（不明なら空欄）">
          </div>
          <div class="field-block">
            <label>注意書き</label>
            <textarea id="if-note" rows="2" placeholder="作業上の注意点など">${esc(f.note || '')}</textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn close" id="if-cancel">キャンセル</button>
          <button class="modal-btn save" id="if-save">${isEdit ? '更新' : '追加'}</button>
        </div>
      </div>
    </div>
  `;
}

function bindItemForm() {
  const close = () => { state.itemForm = null; render(); };
  document.getElementById('if-cancel').addEventListener('click', close);
  document.querySelector('.modal-overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) close();
  });
  document.getElementById('if-save').addEventListener('click', async () => {
    const f = state.itemForm;
    const name = document.getElementById('if-name').value.trim();
    if (!name) { flash('品名は必須です', 'error'); return; }
    const cycleVal = document.getElementById('if-cycle').value.trim();
    const qtyVal = document.getElementById('if-qty').value.trim();
    // 数量は数値なら数値、単位付き(40L等)なら文字列のまま許容
    const qtyNum = Number(qtyVal);
    const quantity = (qtyVal !== '' && !isNaN(qtyNum)) ? qtyNum : qtyVal;

    const item = {
      item_id: f.mode === 'edit' ? f.item_id : genManualItemId(),
      process: document.getElementById('if-process').value.trim(),
      part: document.getElementById('if-part').value.trim(),
      name: name,
      model_no: document.getElementById('if-model').value.trim(),
      model_needs_check: false,   // 手動入力は確認済み扱い
      quantity: quantity,
      cycle_months: cycleVal === '' ? '' : Number(cycleVal),
      prev_change_date: document.getElementById('if-prev').value.trim(),
      prev_change_raw: document.getElementById('if-prev').value.trim(),
      note: document.getElementById('if-note').value.trim(),
      comment: f.comment || '',
    };

    try {
      if (f.mode === 'edit') {
        await apiPost({ action: 'updateMasterItem', item });
        // ローカル反映
        const idx = state.master.findIndex(x => x.item_id === item.item_id);
        if (idx >= 0) state.master[idx] = normalizeMaster(item);
        flash('項目を更新しました', 'success');
      } else {
        await apiPost({ action: 'addMasterItem', item });
        state.master.push(normalizeMaster(item));
        // 追加した項目を「表示中の月の予定」として登録する。
        //   理由: 月次一覧は予定がある項目だけ表示するため、予定を立てないと
        //   追加直後にどこにも出ず確認できない。手動追加＝今やりたい保全なので
        //   当月の予定にしておくのが自然。
        const newRec = makeVirtualRecord(item, state.ym, true);  // planned=true
        await apiPost({ action: 'upsertRecord', record: newRec });
        state.records.push(normalizeRecord(newRec));
        flash('項目を追加しました（今月の予定に登録）', 'success');
      }
    } catch (e) {
      flash('保存エラー: ' + e.message, 'error');
      return;
    }
    state.itemForm = null;
    render();
  });
}

// ═══════════════════════════════════════════════════════════════════
// 項目の削除確認（物理削除・機能要件5）
// ═══════════════════════════════════════════════════════════════════
function renderDeleteConfirm() {
  const item = state.confirmDelItem;
  // この項目に紐づく実施記録の件数を数える（履歴が消える警告のため）
  const recCount = state.records.filter(r => r.item_id === item.item_id).length;
  return `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-head">
          <div class="mh-name" style="color:#f87171;">項目を削除しますか？</div>
        </div>
        <div class="modal-body">
          <div class="del-target">
            <div class="del-name">${esc(item.name) || '(無題)'}</div>
            <div class="del-model font-tech">${esc(item.model_no) || '—'} ・ ${esc(item.item_id)}</div>
          </div>
          <p class="del-warn">この操作は取り消せません。マスターからこの項目を完全に削除します。</p>
          ${recCount > 0 ? `
            <label class="del-check">
              <input type="checkbox" id="del-records" checked>
              <span>紐づく実施記録 <b>${recCount}件</b> も一緒に削除する<br><small>（チェックを外すと記録は残りますが、参照先の項目が消えます）</small></span>
            </label>
          ` : `<p class="del-norec">この項目に紐づく実施記録はありません。</p>`}
        </div>
        <div class="modal-actions">
          <button class="modal-btn close" id="del-cancel">キャンセル</button>
          <button class="modal-btn danger-btn" id="del-confirm">削除する</button>
        </div>
      </div>
    </div>
  `;
}

function bindDeleteConfirm() {
  const close = () => { state.confirmDelItem = null; render(); };
  document.getElementById('del-cancel').addEventListener('click', close);
  document.querySelector('.modal-overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) close();
  });
  document.getElementById('del-confirm').addEventListener('click', async () => {
    const item = state.confirmDelItem;
    const delRecCheckbox = document.getElementById('del-records');
    const deleteRecords = delRecCheckbox ? delRecCheckbox.checked : false;
    try {
      await apiPost({ action: 'deleteMasterItem', item_id: item.item_id, deleteRecords });
      // ローカル反映
      state.master = state.master.filter(x => x.item_id !== item.item_id);
      if (deleteRecords) state.records = state.records.filter(r => r.item_id !== item.item_id);
      flash('項目を削除しました', 'success');
    } catch (e) {
      flash('削除エラー: ' + e.message, 'error');
      return;
    }
    state.confirmDelItem = null;
    render();
  });
}

function bindList() {
  document.getElementById('reload-btn')?.addEventListener('click', loadAll);
  document.getElementById('prev-month')?.addEventListener('click', () => changeMonth(-1));
  document.getElementById('next-month')?.addEventListener('click', () => changeMonth(1));
  // 項目を追加 → 空のフォームを開く
  document.getElementById('add-item-btn')?.addEventListener('click', () => {
    state.itemForm = { mode: 'add', name: '', model_no: '', process: '', part: '',
      cycle_months: '', quantity: '', prev_change_date: '', note: '', comment: '' };
    render();
  });
  // 印刷 → 印刷ビューへ（既定はチェックリスト）
  document.getElementById('print-btn')?.addEventListener('click', () => {
    state.printMode = 'checklist';
    render();
  });
  // 月セレクタをタップ → 月ピッカー開閉
  document.getElementById('month-picker-btn')?.addEventListener('click', () => {
    state.monthPickerOpen = !state.monthPickerOpen;
    render();
  });
  // 年間計画表ボタン → 年間マトリクスの印刷ビュー（画面でも見られる）
  document.getElementById('year-view-btn')?.addEventListener('click', () => {
    state.printMode = 'yearly';
    render();
  });
  // 月ピッカー内の操作
  if (state.monthPickerOpen) {
    document.getElementById('mp-close')?.addEventListener('click', () => {
      state.monthPickerOpen = false;
      render();
    });
    document.getElementById('mp-overlay')?.addEventListener('click', (e) => {
      if (e.target.id === 'mp-overlay') { state.monthPickerOpen = false; render(); }
    });
    document.querySelectorAll('.mp-cell').forEach(c => {
      c.addEventListener('click', () => {
        const m = Number(c.dataset.month);
        state.ym = `${TARGET_YEAR}-${String(m).padStart(2,'0')}`;
        state.monthPickerOpen = false;
        state.filter = 'all';
        render();
      });
    });
  }

  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => { state.filter = c.dataset.filter; render(); });
  });

  // 項目カードのアクション
  document.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.stopPropagation();
      const act = el.dataset.act;
      const id = el.dataset.id;
      const item = state.master.find(x => x.item_id === id);
      if (!item) return;
      const rec = state.records.find(r => r.item_id === id && r.year_month === state.ym)
        || makeVirtualRecord(item, state.ym, isPlannedAuto(item, state.ym));

      if (act === 'open') { state.modalItemId = id; render(); }
      else if (act === 'done') await markDone(item, rec);
      else if (act === 'check') await markChecked(item, rec);
      else if (act === 'undo') await markUndone(item, rec);
      else if (act === 'cancel-pull') await cancelPullForward(item, rec);
      else if (act === 'plan') await togglePlan(item, rec);
    });
  });
}

function changeMonth(delta) {
  const [y, m] = state.ym.split('-').map(Number);
  let nm = m + delta;
  if (nm < 1) nm = 1;
  if (nm > 12) nm = 12;
  state.ym = `${TARGET_YEAR}-${String(nm).padStart(2,'0')}`;
  state.filter = 'all';
  render();
}

// ═══════════════════════════════════════════════════════════════════
// ユーティリティ
// ═══════════════════════════════════════════════════════════════════
function flash(msg, kind) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

// ═══════════════════════════════════════════════════════════════════
// 起動
// ═══════════════════════════════════════════════════════════════════
render();
if (state.apiUrl) loadAll();
</script>
